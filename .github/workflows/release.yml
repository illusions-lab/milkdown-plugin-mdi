name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # npm accepts GitHub Actions provenance only from GitHub-hosted runners.
    # PR and main verification remains on Ubicloud; this
    # release job is the narrowly scoped trusted-publishing exception.
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release tag
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "$RELEASE_TAG"
      - run: npm ci
      - name: Check whether this version is already published
        id: registry
        run: |
          package_spec=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # The complete release suite runs on the self-hosted Linux Verify job
      # before a release is created. Keep this GitHub-hosted job limited to
      # validating the exact tag's package and producing npm provenance.
      - name: Check the package contents
        run: npm pack --dry-run --json --ignore-scripts
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.published == 'false'
        # Do not allow a repository-level NODE_AUTH_TOKEN to override npm's
        # GitHub Actions OIDC trusted-publishing exchange.
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish --provenance
