name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - name: Verify release tag
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run release:check
      - name: Check whether this version is already published
        id: registry
        run: |
          package_spec=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.published == 'false'
        run: npm publish
