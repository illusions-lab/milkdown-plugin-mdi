name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full main commit SHA with successful Verify
        required: true
        type: string
      version:
        description: Exact package version
        required: true
        type: string
      publish_runner:
        description: GitHub-hosted runner pool
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
      recovery_run_id:
        description: Original release run ID (required after a publication attempt)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ inputs.publish_runner }}
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify candidate and recovery origin
        uses: actions/github-script@v8
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        with:
          script: |
            const { CANDIDATE_SHA: sha, RELEASE_VERSION: version, RECOVERY_RUN_ID: recovery } = process.env
            if (!/^[a-f0-9]{40}$/.test(sha) || !/^0\.8\.\d+$/.test(version)) throw new Error('Invalid candidate or version')
            if (context.ref !== 'refs/heads/main') throw new Error('Dispatch Release from main')
            const repo = context.repo
            const comparison = await github.rest.repos.compareCommitsWithBasehead({ ...repo, basehead: `${sha}...main` })
            if (!['ahead', 'identical'].includes(comparison.data.status)) throw new Error('Candidate is not on main')
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { ...repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100 })
            if (!runs.some(run => run.head_branch === 'main' && run.conclusion === 'success')) throw new Error('Candidate has not passed Verify on main')
            try {
              const { data: tag } = await github.rest.git.getRef({ ...repo, ref: `tags/v${version}` })
              let target = tag.object
              while (target.type === 'tag') target = (await github.rest.git.getTag({ ...repo, tag_sha: target.sha })).data.object
              if (target.sha !== sha) throw new Error('Release tag points to another candidate')
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (recovery) {
              if (!/^\d+$/.test(recovery)) throw new Error('Invalid recovery run ID')
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: Number(recovery) })
              if (run.path !== '.github/workflows/release.yml' || run.head_branch !== 'main') throw new Error('Invalid recovery origin')
            }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check package version
        run: test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
      - name: Build original release artifact
        if: inputs.recovery_run_id == ''
        run: |
          npm ci
          npm run build
          npm run test:tarball
          mkdir release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts
          node scripts/release-artifact.mjs record
      - name: Restore original release artifact
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: npm-original-${{ inputs.version }}
          path: release-artifacts
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Validate artifact
        run: node scripts/release-artifact.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: npm-original-${{ inputs.version }}
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: error
      - name: Compare registry bytes
        id: registry
        run: node scripts/release-artifact.mjs registry
      - name: Publish original tarball through OIDC
        if: steps.registry.outputs.published == 'false' && inputs.recovery_run_id == ''
        env:
          NODE_AUTH_TOKEN: ''
          ARCHIVE: ${{ steps.registry.outputs.archive }}
        run: npm publish "$ARCHIVE" --ignore-scripts --access public --provenance
      - name: Wait for matching registry bytes
        run: node scripts/release-artifact.mjs confirm
      - name: Create tag and GitHub Release
        run: |
          tag="v$RELEASE_VERSION"
          if git ls-remote --exit-code origin "refs/tags/$tag"; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$CANDIDATE_SHA"
          else
            git tag "$tag" "$CANDIDATE_SHA"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file CHANGELOG.md release-artifacts/*
          fi
