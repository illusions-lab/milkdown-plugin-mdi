name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # A public fork must not execute untrusted code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Ephemeral Ubuntu 24.04 x64 runner supplied by the Ubicloud GitHub App.
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The self-hosted runner provides its OS browser dependencies. Download
      # only the project browsers so this step does not require sudo access.
      - run: npx playwright install chromium firefox webkit
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:tarball
      - run: npm run debug:build
      - run: npm run test:browser:all
      - run: PLAYWRIGHT_BROWSERS=all npm run test:consumer
      - run: npm run docs:build
