name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:tarball
      - run: npm run debug:build
      - run: npm run test:browser:all
      - run: PLAYWRIGHT_BROWSERS=all npm run test:consumer
      - run: npm run docs:build
