<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milkdown MDI Debug</title>
  </head>
  <body>
    <main>
      <header class="debug-toolbar">
        <div>
          <p class="eyebrow">Standalone debug page</p>
          <h1>Milkdown MDI</h1>
          <p class="description">An isolated editor for inline MDI parsing, editing, and serialization.</p>
        </div>

        <div class="controls" role="group" aria-label="Writing direction">
          <button type="button" data-mode="horizontal-tb">Horizontal</button>
          <button type="button" data-mode="vertical-rl">Vertical</button>
          <button type="button" id="serialize">Serialize MDI</button>
        </div>

        <p id="status" role="status" aria-live="polite">Creating editor…</p>
      </header>

      <section class="frontmatter-panel" aria-labelledby="frontmatter-heading">
        <div>
          <p class="eyebrow">Document metadata</p>
          <h2 id="frontmatter-heading">Front Matter</h2>
        </div>
        <dl id="frontmatter-values" aria-live="polite">
          <div>
            <dt>Status</dt>
            <dd>Waiting for MDI runtime…</dd>
          </div>
        </dl>
      </section>

      <section id="editor" aria-label="Markdown editor"></section>
      <pre id="serialized-output" hidden aria-label="Canonical MDI output"></pre>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
